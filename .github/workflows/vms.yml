name: VMs CICD
permissions:
  contents: write
on:
  push:
    paths:
      - 'VMs/**'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        default: 'apply'
        options:
        - apply
        - destroy
      vm_name:
        description: 'Optional: VM Name (e.g., ZUES-04)'
        required: false
        type: string
      target_node:
        description: 'Target Proxmox Node (e.g., nerd-pve01)'
        required: false
        default: 'nerd-pve01'
        type: string
      ip_address:
        description: 'IP Address (e.g., 10.0.40.24)'
        required: false
        type: string
      vcpu:
        description: 'vCPU Cores'
        required: false
        default: '4'
        type: string
      memory:
        description: 'Memory (MB)'
        required: false
        default: '16384'
        type: string
      disk_size:
        description: 'Disk Size (GB)'
        required: false
        default: '30'
        type: string
      storage:
        description: 'Storage Pool (e.g., ssd1, ssd2)'
        required: false
        default: 'ssd1'
        type: string
      source_template:
        description: 'Source Template'
        required: false
        default: 'ubuntu22-04-template'
        type: string
env:
  tf_version: '1.6.6'
  tg_version: '0.54.12'
  working_dir: './VMs'    

jobs:
  checks:
    runs-on: "self-hosted"  
    #container:
      #image: ubuntu:22.04
    steps:
      - name: Ensure Git is Installed
        run: |
          if ! command -v git &> /dev/null; then
            export DEBIAN_FRONTEND=noninteractive
            sudo apt-get update && sudo apt-get install -y git
          fi

      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Append to vms.yaml (If workflow_dispatch)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.vm_name != '' && github.event.inputs.action == 'apply'
        run: |
          export PATH="/usr/bin:/bin:/usr/sbin:/sbin:/usr/local/bin:/opt/homebrew/bin:$PATH"
          NUM=$(grep -oE '^m[0-9]+:' VMs/vms.yaml | tr -d 'm:' | sort -n | tail -n 1 || true)
          if [ -z "$NUM" ]; then
            NEXT_REF="m1"
          else
            NEXT_REF="m$((NUM + 1))"
          fi
          
          cat <<EOF >> VMs/vms.yaml
          $NEXT_REF:
            name: "${{ github.event.inputs.vm_name }}"
            target_node: "${{ github.event.inputs.target_node }}"
            ip: "${{ github.event.inputs.ip_address }}"
            vcpu: "${{ github.event.inputs.vcpu }}"
            memory: "${{ github.event.inputs.memory }}"
            disk_size: "${{ github.event.inputs.disk_size }}"
            storage: "${{ github.event.inputs.storage }}"
            source_template: "${{ github.event.inputs.source_template }}"
          EOF
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VMs/vms.yaml
          git commit -m "Auto-provision VM: ${{ github.event.inputs.vm_name }} as $NEXT_REF"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}

      - name: Check terragrunt HCL
        uses: gruntwork-io/terragrunt-action@v1
        with:
          tf_version: ${{ env.tf_version }}
          tg_version: ${{ env.tg_version }}
          tg_dir: ${{ env.working_dir }}
          tg_command: 'hclfmt --terragrunt-check --terragrunt-diff'

     
  plan:
      runs-on: self-hosted
      # container:
      #   image: ubuntu:22.04
      #   options: --user root

      needs: [ checks ]
      steps:
      - name: 'Checkout'
        uses: actions/checkout@main
          
      - name: Install 1Password CLI    
        uses: 1password/install-cli-action@v1

      - name: Configure 1Password CLI  
        uses: 1password/load-secrets-action/configure@v1
        with:
          #service-account-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          connect-host: ${{ secrets.OP_CONNECT_HOST }}
          connect-token: ${{ secrets.OP_CONNECT_TOKEN }}

      - name: Load Terraform Credentials
        id: load-terraform-credentials
        uses: 1password/load-secrets-action@v1
        with:
            export-env: True
        env:
            TF_VAR_ssh_password: op://secrets/Terraform/ssh_password
            TF_VAR_ssh_user: op://secrets/Terraform/ssh_user
            TF_VAR_ciuser: op://secrets/Terraform/ciuser
            TF_VAR_cipassword: op://secrets/Terraform/cipassword
            TF_VAR_ssh_pub_keys: op://secrets/Terraform/ssh_pub_key
            TF_VAR_proxmox_api_token_id: op://secrets/ProxmoxAPI/username
            TF_VAR_proxmox_api_token_secret: op://secrets/ProxmoxAPI/password
            TF_VAR_proxmox_api_url: op://secrets/Terraform/host
            AWS_ACCESS_KEY_ID: op://secrets/Terraform/garage_access_key
            AWS_SECRET_ACCESS_KEY: op://secrets/Terraform/garage_secret_key
            AWS_ENDPOINT_URL_S3: op://secrets/Terraform/garage_endpoint
            PROXMOX_VE_INSECURE: true
            PM_TLS_INSECURE: true
      - name: Clean Cache and Debug
        run: |
          rm -rf .terragrunt-cache || true
          rm -rf .terraform || true
          echo "AWS_ACCESS_KEY_ID length is: ${#AWS_ACCESS_KEY_ID}"
          echo "AWS_SECRET_ACCESS_KEY length is: ${#AWS_SECRET_ACCESS_KEY}"
          echo "AWS_ENDPOINT_URL_S3 is: ${AWS_ENDPOINT_URL_S3}"
      - name: Init
        uses: gruntwork-io/terragrunt-action@v1
        with:
            tf_version: ${{ env.tf_version }}
            tg_version: ${{ env.tg_version }}
            tg_dir: ${{ env.working_dir }}
            tg_command: 'init'
       
      - name: Plan
        uses: gruntwork-io/terragrunt-action@v1
        with:
          tf_version: ${{ env.tf_version }}
          tg_version: ${{ env.tg_version }}
          tg_dir: ${{ env.working_dir }}
          tg_command: 'plan'
        
  deploy:
      runs-on: self-hosted
      needs: [ plan ]
      if: github.ref == 'refs/heads/main'
      steps:
        - name: 'Checkout'
          uses: actions/checkout@main

        - name: Install 1Password CLI    
          uses: 1password/install-cli-action@v1
  
        - name: Configure 1Password CLI  
          uses: 1password/load-secrets-action/configure@v1
          with:
            #service-account-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
            connect-host: ${{ secrets.OP_CONNECT_HOST }}
            connect-token: ${{ secrets.OP_CONNECT_TOKEN }}
  
        - name: Load Terraform Credentials
          id: load-terraform-credentials
          uses: 1password/load-secrets-action@v1
          with:
              export-env: True
          env:
              TF_VAR_ssh_password: op://secrets/Terraform/ssh_password
              TF_VAR_ssh_user: op://secrets/Terraform/ssh_user
              TF_VAR_ciuser: op://secrets/Terraform/ciuser
              TF_VAR_cipassword: op://secrets/Terraform/cipassword
              TF_VAR_ssh_pub_keys: op://secrets/Terraform/ssh_pub_key
              TF_VAR_proxmox_api_token_id: op://secrets/ProxmoxAPI/username
              TF_VAR_proxmox_api_token_secret: op://secrets/ProxmoxAPI/password
              TF_VAR_proxmox_api_url: op://secrets/Terraform/host
              TF_VAR_AWS_ACCESS_KEY_ID: op://secrets/Terraform/garage_access_key
              TF_VAR_AWS_SECRET_ACCESS_KEY: op://secrets/Terraform/garage_secret_key
              TF_VAR_AWS_ENDPOINT_URL_S3: op://secrets/Terraform/garage_endpoint
              AWS_ACCESS_KEY_ID: op://secrets/Terraform/garage_access_key
              AWS_SECRET_ACCESS_KEY: op://secrets/Terraform/garage_secret_key
              AWS_ENDPOINT_URL_S3: op://secrets/Terraform/garage_endpoint
              PROXMOX_VE_INSECURE: true
              PM_TLS_INSECURE: true
  
        - name: Clean Cache and Debug
          run: |
            rm -rf .terragrunt-cache || true
            rm -rf .terraform || true
            echo "AWS_ACCESS_KEY_ID length is: ${#AWS_ACCESS_KEY_ID}"
            echo "AWS_SECRET_ACCESS_KEY length is: ${#AWS_SECRET_ACCESS_KEY}"
            echo "AWS_ENDPOINT_URL_S3 is: ${AWS_ENDPOINT_URL_S3}"
   
        - name: Init
          uses: gruntwork-io/terragrunt-action@v1
          with:
            tf_version: ${{ env.tf_version }}
            tg_version: ${{ env.tg_version }}
            tg_dir: ${{ env.working_dir }}
            tg_command: 'init'
            
        - name: Deploy
          uses: gruntwork-io/terragrunt-action@v1
          with:
            tf_version: ${{ env.tf_version }}
            tg_version: ${{ env.tg_version }}
            tg_dir: ${{ env.working_dir }}
            tg_command: 'apply'
