name: Containers CICD
permissions:
  contents: write
on:
  push:
    paths:
      - 'Containers/**'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        default: 'apply'
        options:
        - apply
        - destroy
      lxc_name:
        description: 'LXC Hostname (e.g., Nginx-Proxy)'
        required: false
        type: string
      target_node:
        description: 'Target Proxmox Node (e.g., nerd-pve03)'
        required: false
        default: 'nerd-pve04'
        type: string
      ip_address:
        description: 'IP Address (e.g., 10.0.40.24/24)'
        required: false
        type: string
      cores:
        description: 'CPU Cores'
        required: false
        default: '1'
        type: string
      memory:
        description: 'Memory (MB)'
        required: false
        default: '512'
        type: string
      rootfs_size:
        description: 'Disk Size (e.g., 10G)'
        required: false
        default: '10G'
        type: string
      rootfs_storage:
        description: 'Storage Pool (e.g., pve-iscsi-lun0)'
        required: false
        default: 'pve-iscsi-lun0'
        type: string
env:
  tf_version: '1.6.6'
  tg_version: '0.54.12'
  working_dir: './Containers'
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_ENDPOINT_URL_S3: ${{ secrets.AWS_ENDPOINT_URL_S3 }}

    

jobs:
  checks:
    runs-on: "self-hosted"  
    #container:
      #image: ubuntu:22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Append to lxc.yaml (If workflow_dispatch)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.lxc_name != '' && github.event.inputs.action == 'apply'
        run: |
          if ! command -v git &> /dev/null; then
            export DEBIAN_FRONTEND=noninteractive
            sudo apt-get update && sudo apt-get install -y git
          fi
          export PATH="/usr/bin:/bin:/usr/sbin:/sbin:/usr/local/bin:/opt/homebrew/bin:$PATH"
          cat <<EOF >> Containers/lxc.yaml
          ${{ github.event.inputs.lxc_name }}:
            target_node: "${{ github.event.inputs.target_node }}"
            ip: "${{ github.event.inputs.ip_address }}"
            cores: "${{ github.event.inputs.cores }}"
            memory: "${{ github.event.inputs.memory }}"
            rootfs_size: "${{ github.event.inputs.rootfs_size }}"
            rootfs_storage: "${{ github.event.inputs.rootfs_storage }}"
          EOF
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Containers/lxc.yaml
          git commit -m "Auto-provision LXC: ${{ github.event.inputs.lxc_name }}"
          git push origin HEAD:${{ github.ref_name }}

      - name: Check terragrunt HCL
        uses: gruntwork-io/terragrunt-action@v1
        with:
          tf_version: ${{ env.tf_version }}
          tg_version: ${{ env.tg_version }}
          tg_dir: ${{ env.working_dir }}
          tg_command: 'hclfmt --terragrunt-check --terragrunt-diff'

     
  plan:
      runs-on: self-hosted
      # container:
      #   image: ubuntu:22.04
      #   options: --user root

      needs: [ checks ]
      steps:
      - name: 'Checkout'
        uses: actions/checkout@main
          
      - name: Install 1Password CLI    
        uses: 1password/install-cli-action@v1

      - name: Configure 1Password CLI  
        uses: 1password/load-secrets-action/configure@v1
        with:
          #service-account-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          connect-host: ${{ secrets.OP_CONNECT_HOST }}
          connect-token: ${{ secrets.OP_CONNECT_TOKEN }}

      - name: Load Terraform Credentials
        id: load-terraform-credentials
        uses: 1password/load-secrets-action@v1
        with:
            export-env: True
        env:
            TF_VAR_ssh_password: op://secrets/Terraform/ssh_password
            TF_VAR_ssh_user: op://secrets/Terraform/ssh_user
            TF_VAR_ciuser: op://secrets/Terraform/ciuser
            TF_VAR_cipassword: op://secrets/Terraform/cipassword
            TF_VAR_ssh_pub_keys: op://secrets/Terraform/ssh_pub_key
            TF_VAR_proxmox_api_token_id: op://secrets/ProxmoxAPI/username
            TF_VAR_proxmox_api_token_secret: op://secrets/ProxmoxAPI/password
            TF_VAR_proxmox_api_url: op://secrets/Terraform/host

      - name: Init
        uses: gruntwork-io/terragrunt-action@v1
        with:
            tf_version: ${{ env.tf_version }}
            tg_version: ${{ env.tg_version }}
            tg_dir: ${{ env.working_dir }}
            tg_command: 'init'
       
      - name: Plan
        uses: gruntwork-io/terragrunt-action@v1
        with:
          tf_version: ${{ env.tf_version }}
          tg_version: ${{ env.tg_version }}
          tg_dir: ${{ env.working_dir }}
          tg_command: 'plan'
        
  deploy:
      runs-on: self-hosted
      needs: [ plan ]
      if: github.ref == 'refs/heads/main'
      steps:
        - name: 'Checkout'
          uses: actions/checkout@main

        - name: Install 1Password CLI    
          uses: 1password/install-cli-action@v1
  
        - name: Configure 1Password CLI  
          uses: 1password/load-secrets-action/configure@v1
          with:
            #service-account-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
            connect-host: ${{ secrets.OP_CONNECT_HOST }}
            connect-token: ${{ secrets.OP_CONNECT_TOKEN }}
  
        - name: Load Terraform Credentials
          id: load-terraform-credentials
          uses: 1password/load-secrets-action@v1
          with:
              export-env: True
          env:
              TF_VAR_ssh_password: op://secrets/Terraform/ssh_password
              TF_VAR_ssh_user: op://secrets/Terraform/ssh_user
              TF_VAR_ciuser: op://secrets/Terraform/ciuser
              TF_VAR_cipassword: op://secrets/Terraform/cipassword
              TF_VAR_ssh_pub_key: op://secrets/Terraform/ssh_pub_key
              TF_VAR_proxmox_api_token_id: op://secrets/ProxmoxAPI/username
              TF_VAR_proxmox_api_token_secret: op://secrets/ProxmoxAPI/password
              TF_VAR_proxmox_api_url: op://secrets/Terraform/host
              TF_VAR_AWS_ACCESS_KEY_ID: op://secrets/Terraform/minio_access_key
              TF_VAR_AWS_SECRET_ACCESS_KEY: op://secrets/Terraform/minio_secret_key
              TF_VAR_AWS_ENDPOINT_URL_S3: op://secrets/Terraform/minio_endpoint
  
        - name: Init
          uses: gruntwork-io/terragrunt-action@v1
          with:
            tf_version: ${{ env.tf_version }}
            tg_version: ${{ env.tg_version }}
            tg_dir: ${{ env.working_dir }}
            tg_command: 'init'
            
        - name: Deploy
          uses: gruntwork-io/terragrunt-action@v1
          with:
            tf_version: ${{ env.tf_version }}
            tg_version: ${{ env.tg_version }}
            tg_dir: ${{ env.working_dir }}
            tg_command: 'apply'
